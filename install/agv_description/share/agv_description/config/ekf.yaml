ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0

    # EKF owns odom→base_link on /tf exclusively.
    # DiffDrive will have publish_odom_tf disabled in the URDF.
    publish_tf: true

    world_frame:     odom
    odom_frame:      odom
    base_link_frame: base_link

    odom0: /odom
    odom0_config: [
      true,  true,  false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
