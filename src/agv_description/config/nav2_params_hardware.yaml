amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.18
    alpha2: 0.15
    alpha3: 0.28
    alpha4: 0.25
    alpha5: 0.10
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5
    laser_max_range: 6.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: -1.0
    sigma_hit: 0.18
    tf_broadcast: true
    transform_tolerance: 0.20
    update_min_a: 0.05
    update_min_d: 0.03
    z_hit: 0.85
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: false
    always_reset_initial_pose: true
    initial_cov_xx: 0.05
    initial_cov_yy: 0.05
    initial_cov_aa: 0.04

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
