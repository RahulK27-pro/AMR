slam_toolbox:
  ros__parameters:

    # ── Coordinate Frame Configuration ────────────────────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan

    # ── Real Physical Hardware Clock ─────────────────────────────────
    use_sim_time: false

    # ── Operating Mode ───────────────────────────────────────────────
    mode: mapping

    # ── Map Publishing & Resolution ──────────────────────────────────
    transform_publish_period: 0.05     # Publish map->odom TF at 20 Hz
    map_update_interval: 0.5          # Update 2D occupancy grid every 0.5s for snappy RViz feedback
    resolution: 0.05                  # 5 cm grid cell resolution

    # ── Motion Thresholds for Graph Updates ──────────────────────────
    # Low thresholds ensure in-place manual turns add scans continuously without angular smearing
    minimum_travel_distance: 0.04     # 4 cm forward/backward travel
    minimum_travel_heading:  0.04     # ~2.3 degrees rotation

    # ── YDLIDAR X2 Sensor Range Constraints ──────────────────────────
    min_laser_range: 0.12             # Chassis radius is 0.11m; 0.12m rejects body/bracket reflections
    max_laser_range: 8.0              # YDLIDAR X2 maximum specification range

    # ── Network & TF Latency Tolerances ──────────────────────────────
    minimum_time_interval: 0.04       # Accommodates ~24 Hz LiDAR scan streams
    transform_timeout:     0.30       # 300ms buffer absorbs Wi-Fi DDS transmission jitter
    tf_buffer_duration:    30.0       # 30-second transform cache for deep loop closure lookups

    # ── Real-Time Scan Matcher Configuration ─────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 25
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.60
    link_scan_maximum_distance: 1.5

    # Correlation Search Space (Captures dynamic manual teleoperation speeds)
    correlation_search_space_dimension: 0.80
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10

    # ── Loop Closure & Drift Correction ──────────────────────────────
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.65
    loop_match_minimum_response_fine:   0.80

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Angular & Distance Penalties
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── Ceres Non-Linear Optimizer ───────────────────────────────────
    solver_plugin:               solver_plugins::CeresSolver
    ceres_linear_solver:         SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:        SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type:           TRADITIONAL_DOGLEG
    ceres_loss_function:         HuberLoss
