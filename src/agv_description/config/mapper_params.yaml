slam_toolbox:
  ros__parameters:

    # ── Frame names — must match URDF link names exactly ─────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan

    # ── Simulation clock ─────────────────────────────────────────────
    use_sim_time: true

    # ── Mapping mode ─────────────────────────────────────────────────
    mode: mapping

    # ── Map publish period ───────────────────────────────────────────
    # How often SLAM publishes the map→odom TF transform (seconds).
    # 0.05 = 20 Hz — keeps the robot movement smooth in RViz.
    transform_publish_period: 0.05

    # How often the occupancy grid image is rebuilt (seconds).
    map_update_interval: 1.0

    # ── Motion thresholds ────────────────────────────────────────────
    # SLAM only processes a new scan when the robot has moved at least
    # this much since the last processed scan. Very low values ensure
    # SLAM triggers immediately on the first tiny movement.
    minimum_travel_distance: 0.05    # 5 cm
    minimum_travel_heading:  0.05    # ~3 degrees

    # ── LiDAR range ──────────────────────────────────────────────────
    # Must match the <max> value in the URDF lidar sensor block.
    max_laser_range: 12.0

    # ── Timing tolerances ────────────────────────────────────────────
    # minimum_time_interval: minimum seconds between scan processing.
    # transform_timeout: how long SLAM waits for a TF before giving up.
    # tf_buffer_duration: how far back TF history is kept (seconds).
    minimum_time_interval:  0.1
    transform_timeout:      0.2
    tf_buffer_duration:     5.0

    # ── Ceres solver ─────────────────────────────────────────────────
    # Most accurate solver available.
    solver_plugin:               solver_plugins::CeresSolver
    ceres_linear_solver:         SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:        SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type:           TRADITIONAL_DOGLEG
    ceres_loss_function:         None
